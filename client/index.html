<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PlaySpot - Starter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>PlaySpot</h1>
  </header>

  <main>
    <section id="turfs">
      <h2>Available Turfs</h2>
      <div id="turf-list">Loading...</div>
    </section>

    <section id="book">
      <h2>Quick Book (demo)</h2>
      <form id="bookingForm">
        <input id="userId" placeholder="userId (demo)" required />
        <input id="turfId" placeholder="turfId" required />
        <input id="date" type="date" required />
        <input id="start" type="time" required />
        <input id="end" type="time" required />
        <button type="submit">Book</button>
      </form>
      <div id="book-result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
